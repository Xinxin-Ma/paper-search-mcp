services:
  # MCP Server
  paper-search-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paper-search-mcp
    image: paper-search-mcp:latest
    stdin_open: true
    tty: true
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import paper_search_mcp; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Daily Paper Digest Service (optional, if Dockerfile.digest exists)
  paper-digest:
    build:
      context: .
      dockerfile: Dockerfile.digest
    container_name: daily-paper-digest
    environment:
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - RECIPIENT_EMAIL=${RECIPIENT_EMAIL}
    volumes:
      - ./output:/app/output
      - ./logs:/var/log
    restart: unless-stopped
    profiles:
      - digest